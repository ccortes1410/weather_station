<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Air Quality Dashboard{% endblock %}</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('aq_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-icon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.59 4.59A2 2 0 1 1 11 8H2"></path>
                        <path d="M12.59 19.41A2 2 0 1 0 14 16H2"></path>
                        <path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"></path>
                    </svg>
                </span>
                <span class="brand-text">Air Quality Monitor</span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="{{ url_for('home') }}" class="nav-link {% if active_page == 'live' %}active{% endif %}">Live</a>
                <a href="{{ url_for('view_history') }}" class="nav-link {% if active_page == 'history' %}active{% endif %}">History</a>
            </nav>

            <div class="navbar-actions">
                <div id="sensor-status-pill" class="status-pill status-offline" title="Sensor connection status">
                    <span class="status-dot"></span>
                    <span id="sensor-status-text">Checking...</span>
                </div>

                <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark/light theme">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>PMS7003 + Raspberry Pi Pico 2 W</span>
        <span class="footer-sep">&middot;</span>
        <span id="footer-poll-info">Live updates every 5s</span>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
